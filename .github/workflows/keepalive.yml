# Commit kecil sebulan sekali agar GitHub tidak menonaktifkan jadwal workflow
# (repo publik tanpa aktivitas commit selama 60 hari).
name: Jaga jadwal tetap aktif

on:
  schedule:
    - cron: "0 3 1 * *"   # tanggal 1 setiap bulan, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Catat tanggal lalu commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "Keepalive: jaga jadwal workflow tetap aktif"
          git push
